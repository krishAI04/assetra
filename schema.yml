components:
  schemas:
    ApprovalAction:
      type: object
      properties:
        rejection_reason:
          type: string
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    Asset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        firm:
          type: integer
        client:
          type: integer
        client_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        category:
          $ref: '#/components/schemas/CategoryEnum'
        description:
          type: string
        estimated_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - client
      - client_name
      - created_at
      - firm
      - id
      - title
      - updated_at
    AssetDistribution:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        firm:
          type: integer
        asset:
          type: integer
        asset_title:
          type: string
          readOnly: true
        beneficiary:
          type: integer
        beneficiary_name:
          type: string
          readOnly: true
        ownership_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        approval_status:
          $ref: '#/components/schemas/ApprovalStatusEnum'
        approved_by:
          type: integer
          readOnly: true
          nullable: true
        approved_by_name:
          type: string
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_at
      - approved_by
      - approved_by_name
      - asset
      - asset_title
      - beneficiary
      - beneficiary_name
      - created_at
      - firm
      - id
      - ownership_percentage
      - updated_at
